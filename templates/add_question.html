{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-8">

<div class="card shadow">

<div class="card-header bg-success text-white">

<h3>➕ Add New Question</h3>

</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">

<label>Question</label>

<textarea
name="question"
class="form-control"
required></textarea>

</div>

<div class="row">

<div class="col-md-6">

<label>Option 1</label>

<input
type="text"
name="option1"
class="form-control"
required>

</div>

<div class="col-md-6">

<label>Option 2</label>

<input
type="text"
name="option2"
class="form-control"
required>

</div>

</div>

<br>

<div class="row">

<div class="col-md-6">

<label>Option 3</label>

<input
type="text"
name="option3"
class="form-control"
required>

</div>

<div class="col-md-6">

<label>Option 4</label>

<input
type="text"
name="option4"
class="form-control"
required>

</div>

</div>

<br>

<div class="row">

<div class="col-md-6">

<label>Correct Answer</label>

<input
type="text"
name="answer"
class="form-control"
required>

</div>

<div class="col-md-6">

<label>Category</label>

<select
name="category"
class="form-control">

<option>Rajbhasha</option>
<option>Grammar</option>
<option>Official Language</option>
<option>Translation</option>

</select>

</div>

</div>

<br>

<button
class="btn btn-success">

💾 Save Question

</button>

<a
href="/questions"
class="btn btn-secondary">

Cancel

</a>

</form>

</div>

</div>

</div>

</div>

</div>

{% endblock %}
