{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow-lg">

                <div class="card-body p-5">

                    <h2 class="text-center text-success mb-4">

                        🇮🇳 Employee Login

                    </h2>

                    <form method="POST" action="/login">

                        <div class="mb-3">

                            <label class="form-label">

                                Employee ID

                            </label>

                            <input
                                type="text"
                                name="employee"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Full Name

                            </label>

                            <input
                                type="text"
                                name="name"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Department

                            </label>

                            <input
                                type="text"
                                name="department"
                                class="form-control"
                                required>

                        </div>

                        <button
                            class="btn btn-success w-100 btn-lg"
                            type="submit">

                            Login

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
