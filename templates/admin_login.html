{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-5">

<div class="card shadow">

<div class="card-body">

<h2 class="text-center text-warning">

👨‍💼 Admin Login

</h2>

{% if error %}

<div class="alert alert-danger">

{{ error }}

</div>

{% endif %}

<form method="POST">

<input
class="form-control mb-3"
type="text"
name="username"
placeholder="Username"
required>

<input
class="form-control mb-3"
type="password"
name="password"
placeholder="Password"
required>

<button
class="btn btn-warning w-100">

Login

</button>

</form>

</div>

</div>

</div>

</div>

</div>

{% endblock %}
