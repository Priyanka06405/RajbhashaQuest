{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow-lg">

                <div class="card-header bg-success text-white">

                    <h3 class="mb-0">🎮 Rajbhasha Quiz</h3>

                </div>

                <div class="card-body">

                    <h4 class="mb-4">

                        {{ question["question"] }}

                    </h4>

                    <form action="/check_answer" method="POST">

                        <input
                            type="hidden"
                            name="question_id"
                            value="{{ question['id'] }}">

                        <div class="form-check mb-3">

                            <input
                                class="form-check-input"
                                type="radio"
                                name="answer"
                                value="{{ question['option1'] }}"
                                required>

                            <label class="form-check-label">

                                {{ question["option1"] }}

                            </label>

                        </div>

                        <div class="form-check mb-3">

                            <input
                                class="form-check-input"
                                type="radio"
                                name="answer"
                                value="{{ question['option2'] }}">

                            <label class="form-check-label">

                                {{ question["option2"] }}

                            </label>

                        </div>

                        <div class="form-check mb-3">

                            <input
                                class="form-check-input"
                                type="radio"
                                name="answer"
                                value="{{ question['option3'] }}">

                            <label class="form-check-label">

                                {{ question["option3"] }}

                            </label>

                        </div>

                        <div class="form-check mb-4">

                            <input
                                class="form-check-input"
                                type="radio"
                                name="answer"
                                value="{{ question['option4'] }}">

                            <label class="form-check-label">

                                {{ question["option4"] }}

                            </label>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-success">

                            Submit Answer

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
