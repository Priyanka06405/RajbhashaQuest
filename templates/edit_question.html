{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-warning">

<h3>✏ Edit Question</h3>

</div>

<div class="card-body">

<form method="POST">

<label>Question</label>

<textarea
name="question"
class="form-control"
required>{{ question["question"] }}</textarea>

<br>

<div class="row">

<div class="col-md-6">

<label>Option 1</label>

<input
class="form-control"
name="option1"
value="{{ question['option1'] }}"
required>

</div>

<div class="col-md-6">

<label>Option 2</label>

<input
class="form-control"
name="option2"
value="{{ question['option2'] }}"
required>

</div>

</div>

<br>

<div class="row">

<div class="col-md-6">

<label>Option 3</label>

<input
class="form-control"
name="option3"
value="{{ question['option3'] }}"
required>

</div>

<div class="col-md-6">

<label>Option 4</label>

<input
class="form-control"
name="option4"
value="{{ question['option4'] }}"
required>

</div>

</div>

<br>

<div class="row">

<div class="col-md-6">

<label>Correct Answer</label>

<input
class="form-control"
name="answer"
value="{{ question['answer'] }}"
required>

</div>

<div class="col-md-6">

<label>Category</label>

<input
class="form-control"
name="category"
value="{{ question['category'] }}"
required>

</div>

</div>

<br>

<button class="btn btn-warning">

💾 Update Question

</button>

<a href="/questions" class="btn btn-secondary">

Cancel

</a>

</form>

</div>

</div>

</div>

{% endblock %}
